
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Player - Glassmorphism UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #0a0b0d;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fullscreen Video Background */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.45) contrast(1.05);
            pointer-events: none;
        }

        /* Main Player Layout Container */
        .app-container {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* Glassmorphism Effect Cards */
        .glass-card {
            background: rgba(15, 18, 28, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        /* Poster Image Artwork Effect */
        .poster-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 300px;
            border-radius: 24px;
            margin-bottom: 20px;
        }

        .poster-glow {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0) 70%);
            filter: blur(20px);
            opacity: 0.6;
            z-index: 1;
        }

        .poster-img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        /* Marquee Scrolling Text for Artist Name */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .song-artist {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Custom Progress Bar Range Input */
        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            -webkit-appearance: none;
            transition: height 0.2s ease;
        }

        .progress-bar:hover {
            height: 7px;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transition: transform 0.1s ease;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Custom Scrollbar for Song List */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Playlist Item Highlight */
        .playlist-item {
            transition: all 0.2s ease;
        }

        .playlist-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-left: 3px solid #ffffff;
            padding-left: 12px !important;
        }

        .playlist-item:hover:not(.active) {
            background: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

        <!-- Audio Element -->
        <audio id="audio-player" preload="metadata" crossorigin="anonymous"></audio>

            { id: 41, name: "Pop Kinetik", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/0v0mn4.mp3" }
        ];

        // State Tracking Variables
        let currentTrackIndex = 0;
        let isPlaying = false;

        // DOM Element Cache
        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressEl = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const playlistContainer = document.getElementById('playlist-container');
        const likeBtn = document.getElementById('like-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function loadTrack(index, autoPlay = true) {
            if (index < 0 || index >= playlist.length) return;
            
            currentTrackIndex = index;
            const track = playlist[currentTrackIndex];

            titleEl.textContent = track.name;
            artistEl.textContent = track.artist;
            progressEl.value = 0;
            currentTimeEl.textContent = "0:00";
            durationEl.textContent = "0:00";

            audioPlayer.src = track.url;
            updateActivePlaylistItem();

            // Auto-scroll the playlist to the active song item
            const activeItem = playlistContainer.children[currentTrackIndex];
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Set up MediaSession metadata for native browser controls
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.name,
                    artist: track.artist,
                    artwork: [{ src: 'sampul.jpg', sizes: '512x512', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
            }

            if (autoPlay) {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '❚❚';
                }).catch(err => console.log('Autoplay error:', err));
            }
        }

        function togglePlay() {
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            } else {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '❚❚';
                });
            }
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex, true);
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex, true);
        }

        // Render single continuous list for all 41 songs
        function renderPlaylist() {
            playlistContainer.innerHTML = '';

            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = `playlist-item p-2.5 rounded-xl cursor-pointer flex justify-between items-center text-xs transition-all ${index === currentTrackIndex ? 'active' : ''}`;
                
                li.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden pr-2">
                        <span class="text-white/40 font-mono w-5 text-right flex-shrink-0">${index + 1}.</span>
                        <span class="text-white/90 font-medium truncate">${track.name}</span>
                    </div>
                    <span class="text-[10px] text-white/40 flex-shrink-0">${index === currentTrackIndex ? '🎵 Playing' : ''}</span>
                `;

                li.onclick = () => loadTrack(index, true);
                playlistContainer.appendChild(li);
            });
        }

        function updateActivePlaylistItem() {
            const items = playlistContainer.querySelectorAll('li');
            items.forEach((item, idx) => {
                if (idx === currentTrackIndex) {
                    item.classList.add('active');
                    item.querySelector('span:last-child').textContent = '🎵 Playing';
                } else {
                    item.classList.remove('active');
                    item.querySelector('span:last-child').textContent = '';
                }
            });
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        audioPlayer.addEventListener('ended', nextTrack);

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                progressEl.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                durationEl.textContent = formatTime(audioPlayer.duration);
            }
        });

        progressEl.addEventListener('input', () => {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (progressEl.value / 100) * audioPlayer.duration;
            }
        });
