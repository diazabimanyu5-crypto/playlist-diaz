<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist By:@diazabimanyuu_</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px 10px;
            text-align: center; 
            background-color: #121212;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            background: rgba(20, 25, 30, 0.88);
            max-width: 420px;
            margin: 20px auto;
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .poster {
            width: 100%;
            max-height: 260px;
            object-fit: contain;
            border-radius: 14px;
            margin-bottom: 15px;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 20px;
        }

        .marquee-text {
            display: inline-block;
            color: #ff69b4;
            font-size: 18px;
            font-weight: bold;
            padding-left: 100%;
            animation: marquee 10s linear infinite;
        }

        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        .player-card {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .song-info {
            margin-bottom: 15px;
        }

        .song-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            outline: none;
            -webkit-appearance: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 10px;
        }

        .btn-control {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-control:hover {
            opacity: 0.8;
        }

        .btn-control:active {
            transform: scale(0.9);
        }

        .btn-play {
            background: #ffffff;
            color: #000;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 22px;
            padding-left: 3px;
        }

        #list { 
            text-align: left; 
            padding: 0; 
            list-style: none; 
            margin: 0;
            max-height: 320px;
            overflow-y: auto;
        }

        #list::-webkit-scrollbar {
            width: 6px;
        }
        #list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        li { 
            background: rgba(255, 255, 255, 0.08); 
            padding: 12px 16px; 
            margin: 8px 0; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        li.active { 
            background: #ff69b4; 
            color: #000; 
            font-weight: bold; 
            border-color: #ff69b4;
        }

        #yt-player-container {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="bg.jpg" alt="Poster" class="poster">
        
        <div class="marquee-container">
            <span class="marquee-text">Playlist By:@diazabimanyuu_</span>
        </div>

        <div class="player-card">
            <div class="song-info">
                <div class="song-title" id="title">Memuat...</div>
                <div class="song-artist" id="artist">@diazabimanyuu_</div>
            </div>

            <div class="progress-container">
                <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn-control" id="prev-btn">⏮</button>
                <button class="btn-control btn-play" id="play-btn">▶</button>
                <button class="btn-control" id="next-btn">⏭</button>
            </div>
        </div>

        <audio id="audio-player"></audio>

        <div id="yt-player-container">
            <div id="yt-player"></div>
        </div>

        <ul id="list"></ul>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const playlist = [
            { name: "Jefferson", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/9vcdbd.mp3" },
            { name: "Everything you are", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/q14tmt.mp3" },
            { name: "Full album Bernadya", artist: "Bernadya", type: "mp3", url: "https://files.catbox.moe/d3owq2.mp3" },
            { name: "Full album Perunggu", artist: "Perunggu", type: "mp3", url: "https://files.catbox.moe/71u2au.mp3" },
            { name: "Sekian, Terima Kasih", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/qv16ar.mp3" },
            { name: "Bersandarlah", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/nmmb6s.mp3" },
            { name: "FSTVLST full album", artist: "FSTVLST", type: "mp3", url: "https://files.catbox.moe/e21vyk.mp3" },
            { name: "Full album Paradoks Diametral", artist: "Paradoks Diametral", type: "mp3", url: "https://files.catbox.moe/do8aaz.mp3" },
            { name: "Full album Hindia", artist: "Hindia", type: "mp3", url: "https://files.catbox.moe/rz5l15.mp3" },
            { name: "Panasea", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/kynaza.mp3" },
            { name: "Sandiwara semu", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/6ewg4x.mp3" },
            { name: "Kuning", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/myjyb8.mp3" },
            { name: "Anomali", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/0zrnxd.mp3" },
            { name: "ATAS NAMA", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/7s5q5z.mp3" },
            { name: "Track 8", artist: "@diazabimanyuu_", type: "mp3", url: "https://files.catbox.moe/9kq1w9.mp3" },

            { name: "Let Down", artist: "Radiohead", type: "youtube", youtubeId: "ZVgHPSyEIqk" },
            { name: "No Surprises", artist: "Radiohead", type: "youtube", youtubeId: "u5CVsCnxyXg" },
            { name: "Creep", artist: "Radiohead", type: "youtube", youtubeId: "XFkzRNyygfk" },
            { name: "Exit Music (For A Film)", artist: "Radiohead", type: "youtube", youtubeId: "Bf01riuiJWA" },
            { name: "Fake Plastic Trees", artist: "Radiohead", type: "youtube", youtubeId: "n5h0qHwNrHk" },
            { name: "Karma Police", artist: "Radiohead", type: "youtube", youtubeId: "1uYWYWPc9HU" },
            { name: "High and Dry", artist: "Radiohead", type: "youtube", youtubeId: "GaTq1FODBjE" },
            { name: "Champagne Supernova", artist: "Oasis", type: "youtube", youtubeId: "wFNbRmnO5Ag" },
            { name: "Slide Away", artist: "Oasis", type: "youtube", youtubeId: "3GCSUSwcDwg" },
            { name: "Married With Children", artist: "Oasis", type: "youtube", youtubeId: "EOoidN2s5qY" },
            { name: "Wonderwall", artist: "Oasis", type: "youtube", youtubeId: "Cq1sOP5dbfc" },
            { name: "Don't Look Back In Anger", artist: "Oasis", type: "youtube", youtubeId: "BiCAYO2iOnc" },
            { name: "Live Forever", artist: "Oasis", type: "youtube", youtubeId: "nwXF6d-yLK8" }
        ];

        let ytPlayer;
        let isYtReady = false;
        let currentIndex = 0;
        let isPlaying = false;
        let updateInterval;

        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressEl = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const listContainer = document.getElementById('list');

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                playerVars: { 'playsinline': 1, 'controls': 0 },
                events: {
                    'onReady': () => {
                        isYtReady = true;
                        renderList();
                        loadTrack(0, false);
                    },
                    'onStateChange': onYtStateChange
                }
            });
        }

        function onYtStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                nextTrack();
            } else if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playBtn.textContent = '❚❚';
                if (ytPlayer.unMute) ytPlayer.unMute();
                startProgressTimer();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                playBtn.textContent = '▶';
                stopProgressTimer();
            } else if (event.data === YT.PlayerState.BUFFERING) {
                // Deteksi dan hilangkan suara durasi iklan
                checkAndMuteAd();
            }
        }

        function checkAndMuteAd() {
            if (isYtReady && ytPlayer.getVideoData) {
                const videoData = ytPlayer.getVideoData();
                const currentTrack = playlist[currentIndex];
                // Jika ID video yang dimainkan tidak cocok dengan lagu, itu adalah iklan
                if (videoData && videoData.video_id && videoData.video_id !== currentTrack.youtubeId) {
                    if (ytPlayer.mute) ytPlayer.mute();
                } else {
                    if (ytPlayer.unMute) ytPlayer.unMute();
                }
            }
        }

        audioPlayer.addEventListener('ended', nextTrack);
        audioPlayer.addEventListener('timeupdate', () => {
            const track = playlist[currentIndex];
            if (track.type === 'mp3' && audioPlayer.duration) {
                progressEl.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                durationEl.textContent = formatTime(audioPlayer.duration);
            }
        });

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function stopAll() {
            audioPlayer.pause();
            if (isYtReady && ytPlayer && ytPlayer.pauseVideo) {
                ytPlayer.pauseVideo();
            }
            stopProgressTimer();
        }

        function loadTrack(index, autoPlay = true) {
            stopAll();
            currentIndex = index;
            const track = playlist[currentIndex];
            titleEl.textContent = track.name;
            artistEl.textContent = track.artist;
            progressEl.value = 0;
            currentTimeEl.textContent = "0:00";
            durationEl.textContent = "0:00";
            updateActiveListItem();

            if (track.type === 'mp3') {
                audioPlayer.src = track.url;
                if (autoPlay) {
                    audioPlayer.play().then(() => {
                        isPlaying = true;
                        playBtn.textContent = '❚❚';
                    }).catch(e => console.log(e));
                }
            } else if (track.type === 'youtube' && isYtReady) {
                if (autoPlay) {
                    ytPlayer.loadVideoById(track.youtubeId);
                } else {
                    ytPlayer.cueVideoById(track.youtubeId);
                }
            }
        }

        function togglePlay() {
            const track = playlist[currentIndex];
            if (isPlaying) {
                if (track.type === 'mp3') audioPlayer.pause();
                else if (track.type === 'youtube' && isYtReady) ytPlayer.pauseVideo();
                isPlaying = false;
                playBtn.textContent = '▶';
            } else {
                if (track.type === 'mp3') {
                    audioPlayer.play();
                    isPlaying = true;
                    playBtn.textContent = '❚❚';
                } else if (track.type === 'youtube' && isYtReady) {
                    ytPlayer.playVideo();
                }
            }
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex, true);
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex, true);
        }

        function startProgressTimer() {
            stopProgressTimer();
            updateInterval = setInterval(() => {
                const track = playlist[currentIndex];
                if (track.type === 'youtube' && isYtReady && ytPlayer.getCurrentTime) {
                    checkAndMuteAd();
                    const current = ytPlayer.getCurrentTime() || 0;
                    const total = ytPlayer.getDuration() || 0;
                    if (total > 0) {
                        progressEl.value = (current / total) * 100;
                        currentTimeEl.textContent = formatTime(current);
                        durationEl.textContent = formatTime(total);
                    }
                }
            }, 500);
        }

        function stopProgressTimer() {
            clearInterval(updateInterval);
        }

        function updateActiveListItem() {
            const allItems = listContainer.querySelectorAll('li');
            allItems.forEach((el, i) => {
                if (i === currentIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        progressEl.addEventListener('input', () => {
            const track = playlist[currentIndex];
            if (track.type === 'mp3' && audioPlayer.duration) {
                audioPlayer.currentTime = (progressEl.value / 100) * audioPlayer.duration;
            } else if (track.type === 'youtube' && isYtReady && ytPlayer.getDuration) {
                const seekTo = (progressEl.value / 100) * ytPlayer.getDuration();
                ytPlayer.seekTo(seekTo, true);
            }
        });

        function renderList() {
            listContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('li');
                item.innerHTML = `<span>${index + 1}. ${track.name} ${track.artist !== '@diazabimanyuu_' ? '- ' + track.artist : ''}</span>`;
                item.onclick = function() {
                    loadTrack(index, true);
                };
                listContainer.appendChild(item);
            });
        }
    </script>
</body>
</html>
