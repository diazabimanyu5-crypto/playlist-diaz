
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite Music Player</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
        body{background:#0a0b0e;min-height:100vh;color:#fff;display:flex;justify-content:center;align-items:center;padding:15px 10px;position:relative;overflow-x:hidden}
        
        /* Light Ambient CSS Background - Replacing heavy MP4 Video for 0% CPU Lag */
        .ambient-bg{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 50% 20%,#2a1b3d 0%,#11131a 60%,#090a0d 100%);z-index:1;pointer-events:none}
        
        .container{width:100%;max-width:390px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:10}
        .header-title{font-size:12px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,0.7);margin-bottom:16px;text-transform:uppercase}
        
        .poster-container{width:100%;aspect-ratio:1/1;max-height:300px;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,0.7);margin-bottom:16px;background:#181920;border:1px solid rgba(255,255,255,0.12)}
        .poster{width:100%;height:100%;object-fit:cover}
        
        .player-card,.playlist-card,.bottom-nav{width:100%;background:rgba(20,22,30,0.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 24px rgba(0,0,0,0.4);text-align:center}
        
        .song-title{font-size:17px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .marquee-container{width:100%;overflow:hidden;white-space:nowrap;margin-bottom:8px}
        .song-artist{font-size:13px;color:rgba(255,255,255,0.75);display:inline-block}
        
        .progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;outline:none;-webkit-appearance:none;margin-top:8px;cursor:pointer}
        .progress-bar::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,0.8)}
        
        .time-stamps{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.5);margin-top:6px}
        .controls{display:flex;justify-content:space-between;align-items:center;padding:12px 8px 0}
        
        .btn-icon{background:none;border:none;color:rgba(255,255,255,0.7);font-size:16px;cursor:pointer;transition:transform 0.1s}
        .btn-icon:active{transform:scale(0.85)}
        .btn-main{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;transition:transform 0.1s}
        .btn-main:active{transform:scale(0.88)}
        .btn-play{background:#fff;color:#000;width:48px;height:48px;border-radius:50%;font-size:18px;display:flex;justify-content:center;align-items:center;box-shadow:0 4px 15px rgba(255,255,255,0.2)}
        
        .playlist-card{padding:14px 16px}
        .playlist-header{font-size:12px;font-weight:700;color:rgba(255,255,255,0.6);margin-bottom:10px;text-align:left;letter-spacing:1px}
        
        #list{text-align:left;list-style:none;max-height:220px;overflow-y:auto;scroll-behavior:smooth}
        #list::-webkit-scrollbar{width:4px}
        #list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:4px}
        
        li{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;font-size:13px;color:rgba(255,255,255,0.75);display:flex;align-items:center;transition:background 0.2s}
        li:active{background:rgba(255,255,255,0.05)}
        li.active{color:#fff;font-weight:700;background:rgba(255,255,255,0.08);border-radius:8px}
        
        .song-name-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;display:block}
        
        .bottom-nav{margin-top:0;padding:10px 0;display:flex;justify-content:space-around;border-radius:16px}
        .nav-item{color:rgba(255,255,255,0.4);font-size:18px;cursor:pointer}
        .nav-item.active{color:#fff}
        
        .status-badge{font-size:10px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,0.15);margin-bottom:8px;display:inline-block;font-weight:600;letter-spacing:0.5px}
    </style>
</head>
<body>
    <div class="ambient-bg"></div>

    <div class="container">
        <div class="header-title">NOW PLAYING</div>
        <div class="poster-container">
            <img src="sampul.jpg" alt="Poster" class="poster" onerror="this.src='https://placehold.co/300x300/1e2029/ffffff?text=Music'">
        </div>

        <div class="player-card">
            <div id="status" class="status-badge">Ready</div>
            <div class="song-title" id="title">Memuat...</div>
            <div class="marquee-container">
                <div class="song-artist" id="artist">Inst:diazabimanyuu_</div>
            </div>

            <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
            <div class="time-stamps">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button class="btn-icon" id="shuffle-btn" title="Shuffle">🔀</button>
                <button class="btn-main" id="prev-btn">⏮</button>
                <button class="btn-main btn-play" id="play-btn">▶</button>
                <button class="btn-main" id="next-btn">⏭</button>
                <button class="btn-icon" id="like-btn" title="Like">♡</button>
            </div>
        </div>

        <div class="playlist-card">
            <div class="playlist-header" id="playlist-count">PLAYLIST • 41 LAGU</div>
            <ul id="list"></ul>
        </div>

        <div class="bottom-nav">
            <span class="nav-item active">🏠</span>
            <span class="nav-item">🔍</span>
            <span class="nav-item">📚</span>
        </div>

        <audio id="audio-player" preload="metadata"></audio>
    </div>

    <script>
        // High-Speed Mirror Proxy CDN URL Converter to bypass Catbox bottlenecks
        function getFastCdnUrl(url) {
            return "https://wsrv.nl/?url=" + encodeURIComponent(url);
        }

        const playlist = [
            { name: "Sandiwara semu", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/6ewg4x.mp3" },
            { name: "Jefferson", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/9vcdbd.mp3" },
            { name: "Everything you are", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/q14tmt.mp3" },
            { name: "Full album Bernadya", artist: "Bernadya", url: "https://files.catbox.moe/d3owq2.mp3" },
            { name: "Full album Perunggu", artist: "Perunggu", url: "https://files.catbox.moe/71u2au.mp3" },
            { name: "Sekian, Terima Kasih", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/qv16ar.mp3" },
            { name: "Bersandarlah", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/nmmb6s.mp3" },
            { name: "FSTVLST full album", artist: "FSTVLST", url: "https://files.catbox.moe/e21vyk.mp3" },
            { name: "Full album Paradoks Diametral", artist: "Paradoks Diametral", url: "https://files.catbox.moe/do8aaz.mp3" },
            { name: "Full album Hindia", artist: "Hindia", url: "https://files.catbox.moe/rz5l15.mp3" },
            { name: "Panasea", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/kynaza.mp3" },
            { name: "Kuning", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/myjyb8.mp3" },
            { name: "Anomali", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/0zrnxd.mp3" },
            { name: "ATAS NAMA", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/7s5q5z.mp3" },
            { name: "Track 8", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/9kq1w9.mp3" },
            { name: "Champagne Supernova", artist: "Oasis", url: "https://files.catbox.moe/e41vv4.mp3" },
            { name: "Don't Look Back In Anger", artist: "Oasis", url: "https://files.catbox.moe/uxynqm.mp3" },
            { name: "Slide Away", artist: "Oasis", url: "https://files.catbox.moe/tslath.mp3" },
            { name: "Wonderwall", artist: "Oasis", url: "https://files.catbox.moe/64ylcp.mp3" },
            { name: "Tinky Winky full album", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/zskwa1.mp3" },
            { name: "Ceritaku Ceritamu", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/b270xq.mp3" },
            { name: "Kita Kubur Sampai Mati", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/o5azqh.mp3" },
            { name: "Ruang Sendiri", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/xrz84p.mp3" },
            { name: "Who Knows", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/tvltgy.mp3" },
            { name: "10 Menit Untuk Selamanya", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/r4epfg.mp3" },
            { name: "Let Down", artist: "Radiohead", url: "https://files.catbox.moe/cpy5fk.mp3" },
            { name: "No Surprises", artist: "Radiohead", url: "https://files.catbox.moe/1egzv1.mp3" },
            { name: "Fake Plastic Trees", artist: "Radiohead", url: "https://files.catbox.moe/tww0an.mp3" },
            { name: "Creep", artist: "Radiohead", url: "https://files.catbox.moe/am615v.mp3" },
            { name: "Exit Music", artist: "Radiohead", url: "https://files.catbox.moe/vq2k0n.mp3" },
            { name: "Stand By Me", artist: "Oasis", url: "https://files.catbox.moe/9tam7j.mp3" },
            { name: "Married With Children", artist: "Oasis", url: "https://files.catbox.moe/fif5lo.mp3" },
            { name: "Don't Go Away", artist: "Oasis", url: "https://files.catbox.moe/fcfzmu.mp3" },
            { name: "Supersonic", artist: "Oasis", url: "https://files.catbox.moe/qzrzft.mp3" },
            { name: "Sambutlah", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/pgijz3.mp3" },
            { name: "Bertaruh Pada Api", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/rllra6.mp3" },
            { name: "Metafora Berpelukan", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/v3ebyu.mp3" },
            { name: "Lautan Bunga Berwarna Terang", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/1x27ee.mp3" },
            { name: "Disarankan Di Bandung", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/djolg6.mp3" },
            { name: "Lagu Selepas Hujan", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/p1495a.mp3" },
            { name: "Pop Kinetik", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/0v0mn4.mp3" }
        ];

        let currentIndex = 0;
        let isShuffle = false;
        let isLiked = false;
        let hasTriedFallback = false;

        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressEl = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const statusEl = document.getElementById('status');
        const listContainer = document.getElementById('list');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const likeBtn = document.getElementById('like-btn');

        function formatTime(sec) {
            if (isNaN(sec) || sec === Infinity) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function loadTrack(index, autoPlay = false) {
            currentIndex = index;
            hasTriedFallback = false;
            const track = playlist[currentIndex];

            titleEl.textContent = track.name;
            artistEl.textContent = track.artist;
            
            // Set track source directly
            audio.src = track.url;
            audio.load();

            updateActiveItem();

            if (autoPlay) {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        // Retry on fast proxy if initial play stalls
                        audio.src = getFastCdnUrl(track.url);
                        audio.play().catch(() => {});
                    });
                }
            }
        }

        function updateActiveItem() {
            const items = listContainer.querySelectorAll('li');
            items.forEach((el, i) => {
                if (i === currentIndex) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.classList.remove('active');
                }
            });
        }

        playBtn.onclick = () => {
            if (audio.paused) {
                audio.play().catch(() => {
                    audio.src = getFastCdnUrl(playlist[currentIndex].url);
                    audio.play();
                });
            } else {
                audio.pause();
            }
        };

        document.getElementById('prev-btn').onclick = () => {
            let nextIndex = currentIndex - 1;
            if (nextIndex < 0) nextIndex = playlist.length - 1;
            loadTrack(nextIndex, true);
        };

        document.getElementById('next-btn').onclick = () => {
            let nextIndex;
            if (isShuffle) {
                nextIndex = Math.floor(Math.random() * playlist.length);
            } else {
                nextIndex = (currentIndex + 1) % playlist.length;
            }
            loadTrack(nextIndex, true);
        };

        shuffleBtn.onclick = () => {
            isShuffle = !isShuffle;
            shuffleBtn.style.color = isShuffle ? '#00ff88' : 'rgba(255,255,255,0.7)';
        };

        likeBtn.onclick = () => {
            isLiked = !isLiked;
            likeBtn.textContent = isLiked ? '♥' : '♡';
            likeBtn.style.color = isLiked ? '#ff4757' : 'rgba(255,255,255,0.7)';
        };

        // Automatic error handling & CDN fallback
        audio.onerror = () => {
            if (!hasTriedFallback) {
                hasTriedFallback = true;
                statusEl.textContent = "Fast CDN...";
                statusEl.style.background = "rgba(255, 170, 0, 0.3)";
                audio.src = getFastCdnUrl(playlist[currentIndex].url);
                audio.play().catch(() => {
                    statusEl.textContent = "Error";
                    statusEl.style.background = "rgba(255, 0, 0, 0.4)";
                });
            }
        };

        audio.onwaiting = () => { 
            statusEl.textContent = "Buffering..."; 
            statusEl.style.background = "rgba(255,170,0,0.3)";
        };

        audio.onplaying = () => { 
            statusEl.textContent = "Playing ♪"; 
            statusEl.style.background = "rgba(0,255,128,0.25)";
            playBtn.textContent = '❚❚'; 
        };

        audio.onpause = () => { 
            statusEl.textContent = "Paused"; 
            statusEl.style.background = "rgba(255,255,255,0.15)";
            playBtn.textContent = '▶'; 
        };

        audio.ontimeupdate = () => {
            if (audio.duration) {
                progressEl.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationEl.textContent = formatTime(audio.duration);
            }
        };

        audio.onended = () => {
            document.getElementById('next-btn').click();
        };

        progressEl.oninput = () => {
            if (audio.duration) {
                audio.currentTime = (progressEl.value / 100) * audio.duration;
            }
        };

        function renderList() {
            listContainer.innerHTML = '';
            playlist.forEach((track, i) => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="song-name-item">${i + 1}. ${track.name}</span>`;
                li.onclick = () => loadTrack(i, true);
                listContainer.appendChild(li);
            });
            document.getElementById('playlist-count').textContent = `PLAYLIST • ${playlist.length} LAGU`;
        }

        renderList();
        loadTrack(0, false);
    </script>
</body>
</html>
