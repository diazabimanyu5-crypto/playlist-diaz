
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hahahaha, You Idiot!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0c10;
            background-image: 
                radial-gradient(circle at 50% 30%, #1f1235 0%, #0b0c10 70%),
                radial-gradient(circle at 20% 80%, #2a085c 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, #033f63 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
            position: relative;
        }

        /* --- BACKGROUND PARTICLES / GLOW EFFECTS --- */
        .glow-bg {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255,0,128,0.15) 0%, rgba(0,255,255,0.05) 50%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        /* --- MARQUEE NEON RUNNING TEXT --- */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: absolute;
            top: 6%;
            padding: 15px 0;
            z-index: 10;
            background: rgba(12, 13, 16, 0.4);
            border-top: 2px solid rgba(255, 0, 128, 0.3);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .marquee-text {
            display: inline-block;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: marquee 7s linear infinite, blinkRainbow 0.4s infinite alternate;
            padding-left: 100%;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        @keyframes blinkRainbow {
            0% {
                color: #ff0055;
                text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055;
                opacity: 1;
            }
            25% {
                color: #00ffff;
                text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff;
                opacity: 0.5;
            }
            50% {
                color: #00ff66;
                text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66, 0 0 40px #00ff66;
                opacity: 1;
            }
            75% {
                color: #ff00ff;
                text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
                opacity: 0.6;
            }
            100% {
                color: #ffff00;
                text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00, 0 0 40px #ffff00;
                opacity: 1;
            }
        }

        /* --- MAIN ANIMATION SCENE CONTAINER --- */
        .scene {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            margin-top: 40px;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* --- STREAMING_CHUNK:Defining SVG Anime Hand Animations... --- */

        /* SPINNING LEFT ANIME HAND */
        .rotating-hand-group {
            transform-origin: 150px 250px;
            animation: spinLeftHand 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }

        @keyframes spinLeftHand {
            0% {
                transform: rotate(0deg) scale(0.85);
            }
            100% {
                transform: rotate(360deg) scale(0.85);
            }
        }

        /* MAIN ANIME HAND & MIDDLE FINGER ANIMATION */
        .middle-finger-group {
            transform-origin: 350px 225px;
            animation: raiseMiddleFinger 2.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite alternate;
        }

        @keyframes raiseMiddleFinger {
            0% {
                /* Hand fully clenched in a fist */
                transform: translateY(75px) scaleY(0.08);
            }
            35% {
                /* Pauses briefly in full fist */
                transform: translateY(75px) scaleY(0.08);
            }
            100% {
                /* Smoothly extends full anime middle finger up */
                transform: translateY(0px) scaleY(1);
            }
        }

        /* Slight bounce on main hand for fluid life-like motion */
        .main-hand-body {
            transform-origin: 350px 300px;
            animation: handPulse 2.8s ease-in-out infinite alternate;
        }

        @keyframes handPulse {
            0% { transform: translateY(5px); }
            100% { transform: translateY(-5px); }
        }

        /* Responsive scaling */
        @media (max-width: 480px) {
            .marquee-text {
                font-size: 26px;
            }
            .scene {
                height: 350px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Glow Effect -->
    <div class="glow-bg"></div>

    <div class="marquee-container">
        <div class="marquee-text">Hahahaha, you idiot &nbsp;&nbsp;•&nbsp;&nbsp; Hahahaha, you idiot &nbsp;&nbsp;•&nbsp;&nbsp; Hahahaha, you idiot</div>

                    <path d="M 341 152 C 348 146, 352 146, 359 152" stroke="#2b1105" stroke-width="2.5" stroke-linecap="round"/>

                    <!-- Anime Nail Contour -->

                </g>

                <!-- 2. WRIST & SLEEVE (MAIN HAND) -->

                <path d="M 315 275 Q 350 285 385 275" stroke="#00ffff" stroke-width="3.5"/>

                <!-- Inner Palm Cel-Shading -->

                <!-- INDEX FINGER (FOLDED) -->

                <path d="M 372 176 Q 384 182 390 176" stroke="#2b1105" stroke-width="2.5" stroke-linecap="round"/>
