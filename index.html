    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #08080a;
            color: #ffffff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar for Playlist */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(22, 22, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Audio Progress Range */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.2);
            height: 4px;
            border-radius: 2px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -4px;
            background-color: #ffffff;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s ease;
        }
        input[type="range"]:active::-webkit-slider-thumb {
            transform: scale(1.3);
        }

        /* Video Container Aspect Ratio Fix */
        .media-container {
            aspect-ratio: 1 / 1;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        
        .active-song-row {
            background: rgba(255, 255, 255, 0.08);
            border-left: 3px solid #3b82f6;
        }
    </style>
</head>

            <video id="bg-video" loop muted playsinline class="absolute inset-0 w-full h-full object-cover hidden">

            </video>

            <button id="video-toggle-btn" class="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-medium text-white/80 border border-white/10 hover:bg-black/80 flex items-center gap-1.5 transition">

        </div>

            <div id="status-badge" class="px-3 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mb-2">
                Ready
            </div>

            <!-- Song Title & Artist -->
            <h2 id="song-title" class="text-lg font-bold text-white text-center truncate w-full px-2">

            </h2>
            <p id="song-artist" class="text-xs text-gray-400 text-center mb-4 truncate w-full">
                iazabimanyuu_
            </p>

            <!-- Progress Bar -->
            <div class="w-full mb-1">
                <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full">
                <div class="flex justify-between text-[10px] text-gray-400 font-medium mt-1">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="w-full flex items-center justify-between px-2 pt-2">
                <!-- Shuffle -->
                <button id="shuffle-btn" class="text-gray-400 hover:text-white transition text-sm">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                
                <!-- Prev -->
                <button id="prev-btn" class="text-white hover:text-gray-300 transition text-xl p-2">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <!-- Play/Pause -->
                <button id="play-btn" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center text-lg hover:scale-105 active:scale-95 transition shadow-lg shadow-white/10">
                    <i id="play-icon" class="fa-solid fa-play ml-0.5"></i>
                </button>

                <!-- Next -->
                <button id="next-btn" class="text-white hover:text-gray-300 transition text-xl p-2">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

                <!-- Heart / Favorite -->
                <button id="like-btn" class="text-gray-400 hover:text-rose-500 transition text-sm">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>
        </div>

        <div class="glass-card w-full rounded-2xl p-4 flex flex-col shadow-xl">
            <div class="flex items-center justify-between mb-3 px-1">
                <span class="text-[11px] font-bold text-gray-400 tracking-wider">
                    PLAYLIST • <span id="track-count">41</span> LAGU
                </span>
                <button id="autoplay-toggle" class="text-[10px] text-gray-400 hover:text-white flex items-center gap-1">
                    <span>Autoplay: ON</span>

            </div>

            <!-- Playlist Scroll Container -->
            <ul id="playlist-container" class="max-h-[220px] overflow-y-auto space-y-1 pr-1">
                <!-- Dynamic Items Inserted via JS -->
            </ul>
        </div>
    </div>

        // Player DOM References
        let currentIndex = 2; // Default starting track index (Everything you are)
        let isShuffle = false;

        let isVideoMode = false;

        const audio = document.getElementById('audio-element');
        const bgVideo = document.getElementById('bg-video');
        const posterImg = document.getElementById('poster-img');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const songTitle = document.getElementById('song-title');
        const songArtist = document.getElementById('song-artist');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const statusBadge = document.getElementById('status-badge');
        const playlistContainer = document.getElementById('playlist-container');
        const trackCount = document.getElementById('track-count');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const likeBtn = document.getElementById('like-btn');
        const videoToggleBtn = document.getElementById('video-toggle-btn');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function loadTrack(index, shouldPlay = false) {
            currentIndex = index;
            const track = playlist[currentIndex];

            songTitle.textContent = track.name;
            songArtist.textContent = track.artist;
            
            audio.src = track.src;
            audio.load();

            // Video loop handler
            if (track.video && isVideoMode) {
                bgVideo.src = track.video;
                bgVideo.classList.remove('hidden');
                posterImg.classList.add('opacity-0');
                bgVideo.play().catch(() => {});
            } else {
                bgVideo.pause();
                bgVideo.classList.add('hidden');
                posterImg.classList.remove('opacity-0');
            }

            updatePlaylistUI();

            if (shouldPlay) {
                playAudio();
            } else {
                setPauseState();
            }
        }

        function playAudio() {
            audio.play().then(() => {
                setPlayState();
                if (!bgVideo.classList.contains('hidden')) {
                    bgVideo.play().catch(() => {});
                }
            }).catch(err => {
                setStatus('Gagal Memuat Audio', 'red');
            });
        }

        function pauseAudio() {
            audio.pause();
            bgVideo.pause();
            setPauseState();
        }

        function setPlayState() {
            playIcon.className = "fa-solid fa-pause";
            setStatus("Playing ♪", "emerald");
        }

        function setPauseState() {
            playIcon.className = "fa-solid fa-play ml-0.5";
            setStatus("Paused", "zinc");
        }

        function setStatus(text, color) {
            statusBadge.textContent = text;
            if (color === 'emerald') {
                statusBadge.className = "px-3 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mb-2";
            } else if (color === 'red') {
                statusBadge.className = "px-3 py-0.5 rounded-full text-[10px] font-semibold bg-red-500/20 text-red-400 border border-red-500/30 mb-2";
            } else {
                statusBadge.className = "px-3 py-0.5 rounded-full text-[10px] font-semibold bg-zinc-500/20 text-zinc-300 border border-zinc-500/30 mb-2";
            }
        }

        function updatePlaylistUI() {
            const listItems = playlistContainer.querySelectorAll('li');
            listItems.forEach((li, i) => {
                if (i === currentIndex) {
                    li.className = "active-song-row flex items-center justify-between p-2 rounded-lg cursor-pointer transition text-white font-bold";
                } else {
                    li.className = "flex items-center justify-between p-2 rounded-lg cursor-pointer transition text-gray-400 hover:text-white hover:bg-white/5";
                }
            });
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            trackCount.textContent = playlist.length;

            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                li.onclick = () => loadTrack(index, true);

                li.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <span class="text-xs font-mono w-5 text-gray-500">${index + 1}.</span>
                        <span class="text-xs truncate">${track.name}</span>
                    </div>
                `;
                playlistContainer.appendChild(li);
            });
        }

        playBtn.onclick = () => {
            if (audio.paused) playAudio();
            else pauseAudio();
        };

        prevBtn.onclick = () => {
            let nextIndex = currentIndex - 1;
            if (nextIndex < 0) nextIndex = playlist.length - 1;
            loadTrack(nextIndex, true);
        };

        nextBtn.onclick = () => {
            let nextIndex = isShuffle 
                ? Math.floor(Math.random() * playlist.length) 
                : (currentIndex + 1) % playlist.length;
            loadTrack(nextIndex, true);
        };

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percentage;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalDurationEl.textContent = formatTime(audio.duration);
            }
        };

        progressBar.oninput = () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        };

        audio.onwaiting = () => setStatus("Buffering...", "zinc");
        audio.onplaying = () => setPlayState();
        audio.onended = () => {
            let nextIndex = isShuffle 
                ? Math.floor(Math.random() * playlist.length) 
                : (currentIndex + 1) % playlist.length;
            loadTrack(nextIndex, true);
        };

        audio.onerror = () => setStatus("Gagal Memuat Audio", "red");
