<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0c0d10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* Animasi Jari Tengah Naik */
        .middle-finger {
            transform-origin: bottom center;
            animation: raiseFinger 2s cubic-bezier(0.4, 0, 0.2, 1) forwards infinite alternate;
        }

        @keyframes raiseFinger {
            0% {
                /* Posisi awal: tertekuk ke bawah (seperti mengepal) */
                transform: translateY(65px) scaleY(0.2);
            }
            40% {
                /* Diam sebentar dalam posisi mengepal */
                transform: translateY(65px) scaleY(0.2);
            }
            100% {
                /* Naik penuh ke atas */
                transform: translateY(0) scaleY(1);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Jari Tengah (Bagian yang Bergerak) -->
            <g class="middle-finger">
                <rect x="88" y="30" width="24" height="90" rx="12" fill="#ffffff"/>
            </g>

            <!-- Jari Kelingking (Tertekuk) -->
            <rect x="142" y="95" width="22" height="45" rx="11" fill="#dddddd"/>
            
            <!-- Jari Manis (Tertekuk) -->
            <rect x="116" y="90" width="22" height="50" rx="11" fill="#eeeeee"/>

            <!-- Jari Telunjuk (Tertekuk) -->
            <rect x="62" y="90" width="22" height="50" rx="11" fill="#eeeeee"/>

            <!-- Ibu Jari / Jempol (Menutup di depan) -->
            <path d="M 45 115 C 45 100, 75 105, 90 120 C 95 125, 85 140, 70 140 C 55 140, 45 130, 45 115 Z" fill="#ffffff"/>

            <!-- Telapak & Pergelangan Tangan -->
            <path d="M 55 125 L 145 125 L 140 180 L 60 180 Z" fill="#cccccc"/>
        </svg>
    </div>

</body>
</html>
