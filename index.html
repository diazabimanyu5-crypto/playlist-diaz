<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOW PLAYING</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.98)), url('https://picsum.photos/800/1200?blur=5');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            padding: 20px 15px 40px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
        }

        .top-bar .title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #b3b3b3;
        }

        .top-bar .badge {
            background-color: #26262a;
            color: #b3b3b3;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Cover Image */
        .cover-box {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Player Card */
        .player-card {
            background-color: #16161a;
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #232328;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .song-title {
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .inst-credit {
            text-align: right;
            font-size: 11px;
            color: #a0a0a5;
            margin-top: -5px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background-color: #333338;
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 3px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -3.5px;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8e8e93;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px 5px 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-icon:active {
            transform: scale(0.9);
        }

        .btn-icon:hover {
            opacity: 1;
        }

        .btn-shuffle {
            background-color: #d97706;
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 1;
        }

        .btn-play {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            font-size: 20px;
            opacity: 1;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }

        /* Playlist Card */
        .playlist-card {
            background-color: #16161a;
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid #232328;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-header h3 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .playlist-header .count {
            font-size: 12px;
            color: #8e8e93;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1f1f24;
            padding: 8px;
            border-radius: 16px;
        }

        .btn-page {
            background-color: #2c2c32;
            border: none;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Top Bar -->
        <div class="top-bar">
            <span class="title">NOW PLAYING</span>
            <span class="badge" id="pageBadge">Page 1 / 5</span>
        </div>

        <!-- Cover Image -->
        <div class="cover-box">
            <img id="albumCover" src="https://picsum.photos/600/600?random=1" alt="Cover">
        </div>

        <!-- Music Player Card -->
        <div class="player-card">
            <div class="song-title" id="songTitle">Sambutlah - The Jeblogs</div>
            <div class="inst-credit">Inst:diazabimanyuu_</div>

            <!-- Progress -->
            <div class="progress-container">
                <div class="progress-bar" onclick="seekAudio(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn-icon btn-shuffle" title="Shuffle">🔀</button>
                <button class="btn-icon" onclick="prevSong()" title="Previous">⏮</button>
                <button class="btn-icon btn-play" id="playBtn" onclick="togglePlay()" title="Play/Pause">▶</button>
                <button class="btn-icon" onclick="nextSong()" title="Next">⏭</button>
                <button class="btn-icon" title="Favorite">♡</button>
            </div>
        </div>

        <!-- Playlist Card -->
        <div class="playlist-card">
            <div class="playlist-header">
                <h3>PLAYLIST</h3>
                <span class="count">41 Lagu</span>
            </div>

            <div class="pagination">
                <button class="btn-page" onclick="prevPage()">❮ Prev Page</button>
                <span class="page-num" id="pageText" style="font-size: 12px; color: #b3b3b3;">1 / 5</span>
                <button class="btn-page" onclick="nextPage()">Next Page ❯</button>
            </div>
        </div>

    </div>

    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script>
        // Daftar Tautan MP3 yang Stabil dan Bebas Blokir
        const songs = [
            { 
                title: "Sambutlah - The Jeblogs", 
                src: "https://actions.google.com/sounds/v1/ambiences/rain_heavy.ogg", 
                cover: "https://picsum.photos/600/600?random=11" 
            },
            { 
                title: "Tanah Indah - FSTVLST", 
                src: "https://actions.google.com/sounds/v1/transportation/car_horn.ogg", 
                cover: "https://picsum.photos/600/600?random=12" 
            },
            { 
                title: "Acoustic Chill Beats", 
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", 
                cover: "https://picsum.photos/600/600?random=13" 
            }
        ];

        let currentIndex = 0;
        let currentPage = 1;
        const totalPages = 5;

        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const songTitle = document.getElementById('songTitle');
        const albumCover = document.getElementById('albumCover');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        function loadSong(index) {
            const song = songs[index];
            songTitle.innerText = song.title;
            albumCover.src = song.cover;
            audio.src = song.src;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.innerText = '⏸';
                }).catch(err => {
                    alert("Klik sekali lagi untuk memutar audio.");
                });
            } else {
                audio.pause();
                playBtn.innerText = '▶';
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            loadSong(currentIndex);
            audio.play().then(() => {
                playBtn.innerText = '⏸';
            });
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadSong(currentIndex);
            audio.play().then(() => {
                playBtn.innerText = '⏸';
            });
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationEl.innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            nextSong();
        });

        function formatTime(time) {
            const mins = Math.floor(time / 60);
            const secs = Math.floor(time % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function seekAudio(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updatePageUI();
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePageUI();
            }
        }

        function updatePageUI() {
            document.getElementById('pageText').innerText = `${currentPage} / ${totalPages}`;
            document.getElementById('pageBadge').innerText = `Page ${currentPage} / ${totalPages}`;
        }

        // Muat lagu awal
        loadSong(currentIndex);
    </script>
</body>
</html>
