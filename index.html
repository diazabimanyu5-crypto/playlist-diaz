<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>playlist by:diazabimanyuu_</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.98)), url('https://picsum.photos/800/1200?blur=5');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            padding: 20px 15px 40px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
        }

        .top-bar .title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #b3b3b3;
        }

        .top-bar .badge {
            background-color: #26262a;
            color: #1DB954;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Branding Card */
        .branding-card {
            background-color: #16161a;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #232328;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .branding-card h1 {
            color: #1DB954;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .branding-card p {
            color: #a0a0a5;
            font-size: 12px;
        }

        /* Playlist Card Container */
        .playlist-card {
            background-color: #16161a;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #232328;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .playlist-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .playlist-header .inst {
            font-size: 11px;
            color: #a0a0a5;
        }

        .iframe-wrapper {
            width: 100%;
            height: 280px;
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Footer Pagination */
        .page-card {
            background-color: #16161a;
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #232328;
        }

        .btn-page {
            background-color: #2c2c32;
            border: none;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .page-num {
            font-size: 12px;
            color: #b3b3b3;
            font-weight: 600;
        }
    </style>
</head>
<body>
