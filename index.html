<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist - Now Playing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            background: #0a0b0d;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas untuk Animasi Hujan - Dibuat Paling Atas Latar Belakang */
        #rain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Agar tidak mengganggu klik pada tombol */
            z-index: 1; /* Di atas background body */
        }

        .container {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10; /* Di atas animasi hujan agar tombol bisa diklik */
        }

        /* Header "Now Playing" */
        .header-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Cover Art / Poster Image */
        .poster-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 310px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Glassmorphism Player Card */
        .player-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .song-info {
            margin-bottom: 15px;
            overflow: hidden;
        }

        .song-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Wadah Teks Berjalan (Marquee) */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .song-artist {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            display: inline-block;
            padding-left: 100%;
            animation: marquee 10s linear infinite;
            font-weight: 500;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            outline: none;
            -webkit-appearance: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
            font-weight: 500;
        }

        /* Player Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px 0 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-main {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .btn-main:active {
            transform: scale(0.88);
        }

        .btn-play {
            background: rgba(255, 255, 255, 0.9);
            color: #000000;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Glassmorphism Playlist Section */
        .playlist-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 22px;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .playlist-header {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
            text-align: left;
        }

        #list { 
            text-align: left; 
            padding: 0; 
            list-style: none; 
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }

        #list::-webkit-scrollbar {
            width: 4px;
        }
        #list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        li { 
            padding: 10px 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer; 
            transition: 0.2s ease;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.85);
        }

        li:last-child {
            border-bottom: none;
        }

        li.active { 
            color: #ffffff; 
            font-weight: 700;
        }

        .song-name-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
        }

        .song-duration-item {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            margin-top: 14px;
            padding: 10px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .nav-item {
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Canvas Hujan Ditaruh Paling Atas -->
    <canvas id="rain-canvas"></canvas>

    <div class="container">
        <!-- Header -->
        <div class="header-title">Now Playing</div>

        <!-- Poster Image -->
        <div class="poster-container">
            <img src="sampul.jpg" alt="Poster" class="poster">
        </div>

        <!-- Player Card -->
        <div class="player-card">
            <div class="song-info">
                <div class="song-title" id="title">Memuat...</div>
                <div class="marquee-container">
                    <div class="song-artist" id="artist">Inst:diazabimanyuu_</div>
                </div>
            </div>

            <div class="progress-container">
                <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn-icon" id="shuffle-btn">🔀</button>
                <button class="btn-main" id="prev-btn">⏮</button>
                <button class="btn-main btn-play" id="play-btn">▶</button>
                <button class="btn-main" id="next-btn">⏭</button>
                <button class="btn-icon" id="like-btn">♡</button>
            </div>
        </div>

        <!-- Playlist Card -->
        <div class="playlist-card">
            <div class="playlist-header" id="playlist-count">Playlist • 19 lagu</div>
            <ul id="list"></ul>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <span class="nav-item active">🏠</span>
            <span class="nav-item">🔍</span>
            <span class="nav-item">📚</span>
        </div>

        <audio id="audio-player" preload="metadata" crossorigin="anonymous"></audio>
    </div>

    <script>
        const playlist = [
            { name: "Sandiwara semu", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/6ewg4x.mp3" },
            { name: "Jefferson", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/9vcdbd.mp3" },
            { name: "Everything you are", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/q14tmt.mp3" },
            { name: "Full album Bernadya", artist: "Bernadya", url: "https://files.catbox.moe/d3owq2.mp3" },
            { name: "Full album Perunggu", artist: "Perunggu", url: "https://files.catbox.moe/71u2au.mp3" },
            { name: "Sekian, Terima Kasih", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/qv16ar.mp3" },
            { name: "Bersandarlah", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/nmmb6s.mp3" },
            { name: "FSTVLST full album", artist: "FSTVLST", url: "https://files.catbox.moe/e21vyk.mp3" },
            { name: "Full album Paradoks Diametral", artist: "Paradoks Diametral", url: "https://files.catbox.moe/do8aaz.mp3" },
            { name: "Full album Hindia", artist: "Hindia", url: "https://files.catbox.moe/rz5l15.mp3" },
            { name: "Panasea", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/kynaza.mp3" },
            { name: "Kuning", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/myjyb8.mp3" },
            { name: "Anomali", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/0zrnxd.mp3" },
            { name: "ATAS NAMA", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/7s5q5z.mp3" },
            { name: "Track 8", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/9kq1w9.mp3" },
            { name: "Champagne Supernova", artist: "Oasis", url: "https://files.catbox.moe/e41vv4.mp3" },
            { name: "Don't Look Back In Anger", artist: "Oasis", url: "https://files.catbox.moe/uxynqm.mp3" },
            { name: "Slide Away", artist: "Oasis", url: "https://files.catbox.moe/tslath.mp3" },
            { name: "Wonderwall", artist: "Oasis", url: "https://files.catbox.moe/64ylcp.mp3" }
        ];

        let currentIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressEl = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const listContainer = document.getElementById('list');
        const playlistCountEl = document.getElementById('playlist-count');
        const likeBtn = document.getElementById('like-btn');

        playlistCountEl.textContent = `Playlist • ${playlist.length} lagu`;

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function loadTrack(index, autoPlay = true) {
            currentIndex = index;
            const track = playlist[currentIndex];
            
            titleEl.textContent = track.name;
            artistEl.textContent = track.artist;
            progressEl.value = 0;
            currentTimeEl.textContent = "0:00";
            durationEl.textContent = "0:00";
            updateActiveListItem();

            audioPlayer.src = track.url;

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.name,
                    artist: track.artist,
                    artwork: [{ src: 'sampul.jpg', sizes: '512x512', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
            }

            if (autoPlay) {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '❚❚';
                }).catch(e => console.log(e));
            }
        }

        function togglePlay() {
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            } else {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '❚❚';
                });
            }
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex, true);
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex, true);
        }

        likeBtn.addEventListener('click', () => {
            if (likeBtn.textContent === '♡') {
                likeBtn.textContent = '♥';
                likeBtn.style.color = '#ff4d6d';
            } else {
                likeBtn.textContent = '♡';
                likeBtn.style.color = 'rgba(255, 255, 255, 0.7)';
            }
        });

        audioPlayer.addEventListener('ended', nextTrack);

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                progressEl.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                durationEl.textContent = formatTime(audioPlayer.duration);
            }
        });

        function updateActiveListItem() {
            const allItems = listContainer.querySelectorAll('li');
            allItems.forEach((el, i) => {
                if (i === currentIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        progressEl.addEventListener('input', () => {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (progressEl.value / 100) * audioPlayer.duration;
            }
        });

        function renderList() {
            listContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('li');
                item.innerHTML = `
                    <span class="song-name-item">${index + 1}. ${track.name}</span>
                    <span class="song-duration-item">--:--</span>
                `;
                item.onclick = function() {
                    loadTrack(index, true);
                };
                listContainer.appendChild(item);
            });
        }

        renderList();
        loadTrack(0, false);

        /* SCRIPT ANIMASI HUJAN (DIPERTINGGI VISIBILITASNYA) */
        const canvas = document.getElementById('rain-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const raindrops = [];
        const rainCount = 160; // Diperbanyak jumlah tetesannya

        for (let i = 0; i < rainCount; i++) {
            raindrops.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                length: Math.random() * 25 + 15,
                speed: Math.random() * 12 + 7,
                opacity: Math.random() * 0.5 + 0.3 // Dibuat lebih terang/kelihatan
            });
        }

        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < raindrops.length; i++) {
                const drop = raindrops[i];
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x - 2, drop.y + drop.length); // Sedikit miring agar efek hujan lebih nyata
                ctx.strokeStyle = `rgba(200, 225, 255, ${drop.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.stroke();

                drop.y += drop.speed;
                drop.x -= 0.5;

                if (drop.y > canvas.height) {
                    drop.y = -drop.length;
                    drop.x = Math.random() * canvas.width;
                }
            }

            requestAnimationFrame(drawRain);
        }

        drawRain();
    </script>
</body>
</html>
