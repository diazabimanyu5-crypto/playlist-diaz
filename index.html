<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist By:@diazabimanyuu_</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 20px 10px;
            text-align: center; 
            background-color: #121212;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            background: rgba(0, 0, 0, 0.85);
            max-width: 420px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .poster {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        /* Teks Berjalan Pink */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 15px;
        }

        .marquee-text {
            display: inline-block;
            color: #ff69b4;
            font-size: 22px;
            font-weight: bold;
            padding-left: 100%;
            animation: marquee 10s linear infinite;
        }

        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        audio { 
            width: 100%; 
            margin: 10px 0 15px 0; 
            border-radius: 8px;
        }

        #list { 
            text-align: left; 
            padding: 0; 
            list-style: none; 
            margin: 10px 0 0 0;
        }

        li { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 14px; 
            margin: 10px 0; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 15px;
        }

        li:active, li.active { 
            background: #ff69b4; 
            color: #000; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Poster FSTVLST -->
        <img src="bg.jpg" alt="FSTVLST Poster" class="poster">
        
        <!-- Teks Berjalan Pink -->
        <div class="marquee-container">
            <span class="marquee-text">Playlist By:@diazabimanyuu_</span>
        </div>

        <audio id="player" controls></audio>

        <ul id="list"></ul>
    </div>

    <script>
        const playlist = [
            { name: "Jefferson", url: "https://files.catbox.moe/9vcdbd.mp3" },
            { name: "Everything you are", url: "https://files.catbox.moe/q14tmt.mp3" },
            { name: "Full album Bernadya", url: "https://files.catbox.moe/d3owq2.mp3" },
            { name: "Full album Perunggu", url: "https://files.catbox.moe/71u2au.mp3" },
            { name: "Sekian, Terima Kasih", url: "https://files.catbox.moe/qv16ar.mp3" },
            { name: "Bersandarlah", url: "https://files.catbox.moe/nmmb6s.mp3" },
            { name: "FSTVLST full album", url: "https://files.catbox.moe/e21vyk.mp3" },
            { name: "Full album Paradoks Diametral", url: "https://files.catbox.moe/do8aaz.mp3" },
            { name: "Full album Hindia", url: "https://files.catbox.moe/71u2au.mp3" }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('player');
        const listContainer = document.getElementById('list');

        // Fungsi untuk memutar lagu berdasarkan index
        function playTrack(index) {
            currentIndex = index;
            audio.src = playlist[currentIndex].url;
            audio.load();

            // Update tampilan highlight di daftar lagu
            const allItems = listContainer.querySelectorAll('li');
            allItems.forEach((el, i) => {
                if (i === currentIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            audio.play().catch(err => {
                console.log("Autoplay diblokir browser:", err);
            });
        }

        // Tampilkan daftar lagu di halaman
        playlist.forEach((track, index) => {
            const item = document.createElement('li');
            item.textContent = `${index + 1}. ${track.name}`;
            
            if (index === 0) item.classList.add('active');

            item.onclick = function() {
                playTrack(index);
            };
            
            listContainer.appendChild(item);
        });

        // Load lagu pertama secara awal
        audio.src = playlist[0].url;

        // Otomatis lanjut ke lagu berikutnya ketika lagu selesai
        audio.onended = function() {
            let nextIndex = (currentIndex + 1) % playlist.length;
            playTrack(nextIndex);
        };
    </script>
</body>
</html>
