<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist By:@diazabimanyuu_</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px 10px;
            text-align: center; 
            background-color: #121212;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            background: rgba(20, 25, 30, 0.88);
            max-width: 420px;
            margin: 20px auto;
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .poster {
            width: 100%;
            max-height: 260px;
            object-fit: contain;
            border-radius: 14px;
            margin-bottom: 15px;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 20px;
        }

        .marquee-text {
            display: inline-block;
            color: #ff69b4;
            font-size: 18px;
            font-weight: bold;
            padding-left: 100%;
            animation: marquee 10s linear infinite;
        }

        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        .player-card {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .song-info {
            margin-bottom: 15px;
        }

        .song-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            outline: none;
            -webkit-appearance: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 10px;
        }

        .btn-control {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-control:hover {
            opacity: 0.8;
        }

        .btn-control:active {
            transform: scale(0.9);
        }

        .btn-play {
            background: #ffffff;
            color: #000;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 22px;
            padding-left: 3px;
        }

        #list { 
            text-align: left; 
            padding: 0; 
            list-style: none; 
            margin: 0;
            max-height: 320px;
            overflow-y: auto;
        }

        #list::-webkit-scrollbar {
            width: 6px;
        }
        #list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        li { 
            background: rgba(255, 255, 255, 0.08); 
            padding: 12px 16px; 
            margin: 8px 0; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        li.active { 
            background: #ff69b4; 
            color: #000; 
            font-weight: bold; 
            border-color: #ff69b4;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="bg.jpg" alt="Poster" class="poster">
        
        <div class="marquee-container">
            <span class="marquee-text">Playlist By:@diazabimanyuu_</span>
        </div>

        <div class="player-card">
            <div class="song-info">
                <div class="song-title" id="title">Memuat...</div>
                <div class="song-artist" id="artist">@diazabimanyuu_</div>
            </div>

            <div class="progress-container">
                <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn-control" id="prev-btn">⏮</button>
                <button class="btn-control btn-play" id="play-btn">▶</button>
                <button class="btn-control" id="next-btn">⏭</button>
            </div>
        </div>

        <!-- Pemutar Audio Tunggal (Dukungan Background Audio) -->
        <audio id="audio-player" crossorigin="anonymous"></audio>

        <ul id="list"></ul>
    </div>

    <script>
        const playlist = [
            // --- 15 LAGU CATBOX ---
            { name: "Jefferson", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/9vcdbd.mp3" },
            { name: "Everything you are", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/q14tmt.mp3" },
            { name: "Full album Bernadya", artist: "Bernadya", url: "https://files.catbox.moe/d3owq2.mp3" },
            { name: "Full album Perunggu", artist: "Perunggu", url: "https://files.catbox.moe/71u2au.mp3" },
            { name: "Sekian, Terima Kasih", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/qv16ar.mp3" },
            { name: "Bersandarlah", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/nmmb6s.mp3" },
            { name: "FSTVLST full album", artist: "FSTVLST", url: "https://files.catbox.moe/e21vyk.mp3" },
            { name: "Full album Paradoks Diametral", artist: "Paradoks Diametral", url: "https://files.catbox.moe/do8aaz.mp3" },
            { name: "Full album Hindia", artist: "Hindia", url: "https://files.catbox.moe/rz5l15.mp3" },
            { name: "Panasea", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/kynaza.mp3" },
            { name: "Sandiwara semu", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/6ewg4x.mp3" },
            { name: "Kuning", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/myjyb8.mp3" },
            { name: "Anomali", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/0zrnxd.mp3" },
            { name: "ATAS NAMA", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/7s5q5z.mp3" },
            { name: "Track 8", artist: "@diazabimanyuu_", url: "https://files.catbox.moe/9kq1w9.mp3" },

            // --- 13 LAGU YOUTUBE (DI-STREAM LANGSUNG SEBAGAI AUDIO MURNI) ---
            { name: "Let Down", artist: "Radiohead", youtubeId: "ZVgHPSyEIqk" },
            { name: "No Surprises", artist: "Radiohead", youtubeId: "u5CVsCnxyXg" },
            { name: "Creep", artist: "Radiohead", youtubeId: "XFkzRNyygfk" },
            { name: "Exit Music (For A Film)", artist: "Radiohead", youtubeId: "Bf01riuiJWA" },
            { name: "Fake Plastic Trees", artist: "Radiohead", youtubeId: "n5h0qHwNrHk" },
            { name: "Karma Police", artist: "Radiohead", youtubeId: "1uYWYWPc9HU" },
            { name: "High and Dry", artist: "Radiohead", youtubeId: "GaTq1FODBjE" },
            { name: "Champagne Supernova", artist: "Oasis", youtubeId: "wFNbRmnO5Ag" },
            { name: "Slide Away", artist: "Oasis", youtubeId: "3GCSUSwcDwg" },
            { name: "Married With Children", artist: "Oasis", youtubeId: "EOoidN2s5qY" },
            { name: "Wonderwall", artist: "Oasis", youtubeId: "Cq1sOP5dbfc" },
            { name: "Don't Look Back In Anger", artist: "Oasis", youtubeId: "BiCAYO2iOnc" },
            { name: "Live Forever", artist: "Oasis", youtubeId: "nwXF6d-yLK8" }
        ];

        let currentIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressEl = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const listContainer = document.getElementById('list');

        // Daftar server Invidious alternatif untuk menjamin kestabilan
        const invidiousInstances = [
            "https://inv.tux.pizza",
            "https://invidious.nerdvpn.de",
            "https://invidious.flokinet.to",
            "https://invidious.projectsegfau.lt"
        ];

        // Ekstraksi URL Audio Murni dari YouTube tanpa Iklan
        async function fetchYoutubeAudioUrl(youtubeId) {
            for (let baseUrl of invidiousInstances) {
                try {
                    const res = await fetch(`${baseUrl}/api/v1/videos/${youtubeId}`);
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (data.adaptiveFormats) {
                        const audioStreams = data.adaptiveFormats.filter(f => f.type && f.type.includes('audio'));
                        if (audioStreams.length > 0) {
                            // Ambil kualitas audio tertinggi
                            audioStreams.sort((a, b) => (parseInt(b.bitrate) || 0) - (parseInt(a.bitrate) || 0));
                            return audioStreams[0].url;
                        }
                    }
                } catch (err) {
                    console.warn(`Gagal mengambil audio dari ${baseUrl}, mencoba server lain...`);
                }
            }
            // Fallback cadangan jika instance invidious sibuk
            return `https://invidious.flokinet.to/latest_version?id=${youtubeId}&itag=140`;
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        async function loadTrack(index, autoPlay = true) {
            currentIndex = index;
            const track = playlist[currentIndex];
            
            titleEl.textContent = track.name;
            artistEl.textContent = track.artist;
            progressEl.value = 0;
            currentTimeEl.textContent = "0:00";
            durationEl.textContent = "0:00";
            updateActiveListItem();

            audioPlayer.pause();

            let finalAudioUrl = track.url;
            if (!finalAudioUrl && track.youtubeId) {
                titleEl.textContent = "Memuat audio...";
                finalAudioUrl = await fetchYoutubeAudioUrl(track.youtubeId);
                titleEl.textContent = track.name;
            }

            audioPlayer.src = finalAudioUrl;

            // Memasang MediaSession API agar bisa di-control & tetap menyala saat HP terkunci/keluar dari Chrome
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.name,
                    artist: track.artist,
                    artwork: [{ src: 'bg.jpg', sizes: '512x512', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
            }

            if (autoPlay) {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '❚❚';
                }).catch(e => console.log(e));
            }
        }

        function togglePlay() {
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            } else {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '❚❚';
                });
            }
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex, true);
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex, true);
        }

        audioPlayer.addEventListener('ended', nextTrack);

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                progressEl.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                durationEl.textContent = formatTime(audioPlayer.duration);
            }
        });

        function updateActiveListItem() {
            const allItems = listContainer.querySelectorAll('li');
            allItems.forEach((el, i) => {
                if (i === currentIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        progressEl.addEventListener('input', () => {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (progressEl.value / 100) * audioPlayer.duration;
            }
        });

        function renderList() {
            listContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('li');
                item.innerHTML = `<span>${index + 1}. ${track.name} ${track.artist !== '@diazabimanyuu_' ? '- ' + track.artist : ''}</span>`;
                item.onclick = function() {
                    loadTrack(index, true);
                };
                listContainer.appendChild(item);
            });
        }

        renderList();
        loadTrack(0, false);
    </script>
</body>
    </html>
