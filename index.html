<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player - Anti Buffering</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
        body{background:#0c0d10;min-height:100vh;color:#fff;display:flex;justify-content:center;align-items:center;padding:15px 10px}
        .container{width:100%;max-width:390px;display:flex;flex-direction:column;align-items:center}
        .header-title{font-size:12px;font-weight:600;letter-spacing:1.5px;color:rgba(255,255,255,0.6);margin-bottom:15px;text-transform:uppercase}
        .poster-container{width:100%;aspect-ratio:1/1;max-height:300px;border-radius:18px;overflow:hidden;margin-bottom:16px;background:#18191c;border:1px solid rgba(255,255,255,0.1)}
        .poster{width:100%;height:100%;object-fit:cover}
        .player-card,.playlist-card{width:100%;background:rgba(255,255,255,0.05);border-radius:20px;padding:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.1);text-align:center}
        .song-title{font-size:17px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .song-artist{font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:10px}
        .progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;outline:none;-webkit-appearance:none;cursor:pointer}
        .progress-bar::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
        .time-stamps{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.5);margin-top:6px}
        .controls{display:flex;justify-content:space-between;align-items:center;padding:10px 5px 0}
        .btn-main{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
        .btn-play{background:#fff;color:#000;width:46px;height:46px;border-radius:50%;font-size:18px;display:flex;justify-content:center;align-items:center}
        #list{text-align:left;list-style:none;max-height:220px;overflow-y:auto}
        li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.08);cursor:pointer;font-size:13px;color:rgba(255,255,255,0.7)}
        li.active{color:#fff;font-weight:700}
        .status-badge{font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,0.15);margin-bottom:8px;display:inline-block}
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">NOW PLAYING</div>
        <div class="poster-container"><img src="sampul.jpg" alt="Poster" class="poster"></div>

        <div class="player-card">
            <div id="status" class="status-badge">Ready</div>
            <div class="song-title" id="title">Select Track</div>
            <div class="song-artist" id="artist">Artist</div>

            <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
            <div class="time-stamps">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button class="btn-main" id="prev-btn">⏮</button>
                <button class="btn-main btn-play" id="play-btn">▶</button>
                <button class="btn-main" id="next-btn">⏭</button>
            </div>
        </div>

        <div class="playlist-card">
            <ul id="list"></ul>
        </div>
    </div>

    <audio id="audio-player" preload="auto"></audio>

    <script>
        const playlist = [
            { name: "Sandiwara semu", artist: "Inst:diazabimanyuu_", src: "./music/sandiwara-semu.mp3" },
            { name: "Jefferson", artist: "Inst:diazabimanyuu_", src: "./music/jefferson.mp3" },
            { name: "Everything you are", artist: "Inst:diazabimanyuu_", src: "./music/everything-you-are.mp3" },
            { name: "Full album Bernadya", artist: "Bernadya", src: "./music/full-album-bernadya.mp3" },
            { name: "Full album Perunggu", artist: "Perunggu", src: "./music/full-album-perunggu.mp3" },
            { name: "Sekian, Terima Kasih", artist: "Inst:diazabimanyuu_", src: "./music/sekian-terima-kasih.mp3" },
            { name: "Bersandarlah", artist: "Inst:diazabimanyuu_", src: "./music/bersandarlah.mp3" },
            { name: "FSTVLST full album", artist: "FSTVLST", src: "./music/fstvlst-full-album.mp3" },
            { name: "Full album Paradoks Diametral", artist: "Paradoks Diametral", src: "./music/full-album-paradoks-diametral.mp3" },
            { name: "Full album Hindia", artist: "Hindia", src: "./music/full-album-hindia.mp3" },
            { name: "Panasea", artist: "Inst:diazabimanyuu_", src: "./music/panasea.mp3" },
            { name: "Kuning", artist: "Inst:diazabimanyuu_", src: "./music/kuning.mp3" },
            { name: "Anomali", artist: "Inst:diazabimanyuu_", src: "./music/anomali.mp3" },
            { name: "ATAS NAMA", artist: "Inst:diazabimanyuu_", src: "./music/atas-nama.mp3" },
            { name: "Track 8", artist: "Inst:diazabimanyuu_", src: "./music/track-8.mp3" },
            { name: "Champagne Supernova", artist: "Oasis", src: "./music/champagne-supernova.mp3" },
            { name: "Don't Look Back In Anger", artist: "Oasis", src: "./music/dont-look-back-in-anger.mp3" },
            { name: "Slide Away", artist: "Oasis", src: "./music/slide-away.mp3" },
            { name: "Wonderwall", artist: "Oasis", src: "./music/wonderwall.mp3" },
            { name: "Tinky Winky full album", artist: "Inst:diazabimanyuu_", src: "./music/tinky-winky-full-album.mp3" },
            { name: "Ceritaku Ceritamu", artist: "Inst:diazabimanyuu_", src: "./music/ceritaku-ceritamu.mp3" },
            { name: "Kita Kubur Sampai Mati", artist: "Inst:diazabimanyuu_", src: "./music/kita-kubur-sampai-mati.mp3" },
            { name: "Ruang Sendiri", artist: "Inst:diazabimanyuu_", src: "./music/ruang-sendiri.mp3" },
            { name: "Who Knows", artist: "Inst:diazabimanyuu_", src: "./music/who-knows.mp3" },
            { name: "10 Menit Untuk Selamanya", artist: "Inst:diazabimanyuu_", src: "./music/10-menit-untuk-selamanya.mp3" },
            { name: "Let Down", artist: "Radiohead", src: "./music/let-down.mp3" },
            { name: "No Surprises", artist: "Radiohead", src: "./music/no-surprises.mp3" },
            { name: "Fake Plastic Trees", artist: "Radiohead", src: "./music/fake-plastic-trees.mp3" },
            { name: "Creep", artist: "Radiohead", src: "./music/creep.mp3" },
            { name: "Exit Music", artist: "Radiohead", src: "./music/exit-music.mp3" },
            { name: "Stand By Me", artist: "Oasis", src: "./music/stand-by-me.mp3" },
            { name: "Married With Children", artist: "Oasis", src: "./music/married-with-children.mp3" },
            { name: "Don't Go Away", artist: "Oasis", src: "./music/dont-go-away.mp3" },
            { name: "Supersonic", artist: "Oasis", src: "./music/supersonic.mp3" },
            { name: "Sambutlah", artist: "Inst:diazabimanyuu_", src: "./music/sambutlah.mp3" },
            { name: "Bertaruh Pada Api", artist: "Inst:diazabimanyuu_", src: "./music/bertaruh-pada-api.mp3" },
            { name: "Metafora Berpelukan", artist: "Inst:diazabimanyuu_", src: "./music/metafora-berpelukan.mp3" },
            { name: "Lautan Bunga Berwarna Terang", artist: "Inst:diazabimanyuu_", src: "./music/lautan-bunga-berwarna-terang.mp3" },
            { name: "Disarankan Di Bandung", artist: "Inst:diazabimanyuu_", src: "./music/disarankan-di-bandung.mp3" },
            { name: "Lagu Selepas Hujan", artist: "Inst:diazabimanyuu_", src: "./music/lagu-selepas-hujan.mp3" },
            { name: "Pop Kinetik", artist: "Inst:diazabimanyuu_", src: "./music/pop-kinetik.mp3" }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressEl = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const statusEl = document.getElementById('status');
        const listContainer = document.getElementById('list');

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function loadTrack(index, autoPlay = false) {
            currentIndex = index;
            const track = playlist[currentIndex];
            titleEl.textContent = track.name;
            artistEl.textContent = track.artist;
            
            audio.src = track.src;
            audio.load();

            updateActiveItem();
            if (autoPlay) audio.play().catch(() => {});
        }

        audio.onerror = () => {
            statusEl.textContent = "File Not Found (404)";
            statusEl.style.background = "rgba(255,0,0,0.4)";
        };

        function updateActiveItem() {
            const items = listContainer.querySelectorAll('li');
            items.forEach((el, i) => {
                if (i === currentIndex) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        playBtn.onclick = () => {
            if (audio.paused) audio.play();
            else audio.pause();
        };

        document.getElementById('prev-btn').onclick = () => loadTrack((currentIndex - 1 + playlist.length) % playlist.length, true);
        document.getElementById('next-btn').onclick = () => loadTrack((currentIndex + 1) % playlist.length, true);

        audio.onwaiting = () => { statusEl.textContent = "Loading..."; };
        audio.onplaying = () => { statusEl.textContent = "Playing ♪"; statusEl.style.background = "rgba(0,255,100,0.3)"; playBtn.textContent = '❚❚'; };
        audio.onpause = () => { statusEl.textContent = "Paused"; statusEl.style.background = "rgba(255,255,255,0.15)"; playBtn.textContent = '▶'; };
        audio.onended = () => { loadTrack((currentIndex + 1) % playlist.length, true); };

        audio.ontimeupdate = () => {
            if (audio.duration) {
                progressEl.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationEl.textContent = formatTime(audio.duration);
            }
        };

        progressEl.oninput = () => {
            if (audio.duration) audio.currentTime = (progressEl.value / 100) * audio.duration;
        };

        function renderList() {
            listContainer.innerHTML = '';
            playlist.forEach((track, i) => {
                const li = document.createElement('li');
                li.textContent = `${i + 1}. ${track.name}`;
                li.onclick = () => loadTrack(i, true);
                listContainer.appendChild(li);
            });
        }

        renderList();
        loadTrack(0, false);
    </script>
</body>
</html>
