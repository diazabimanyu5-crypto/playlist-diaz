<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist By:@diazabimanyuu_</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px 10px;
            text-align: center; 
            background-color: #121212;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            background: rgba(20, 25, 30, 0.88);
            max-width: 420px;
            margin: 20px auto;
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .poster {
            width: 100%;
            max-height: 260px;
            object-fit: contain;
            border-radius: 14px;
            margin-bottom: 15px;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 20px;
        }

        .marquee-text {
            display: inline-block;
            color: #ff69b4;
            font-size: 18px;
            font-weight: bold;
            padding-left: 100%;
            animation: marquee 10s linear infinite;
        }

        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        .player-card {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .song-info {
            margin-bottom: 15px;
        }

        .song-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            outline: none;
            -webkit-appearance: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 10px;
        }

        .btn-control {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-control:hover {
            opacity: 0.8;
        }

        .btn-control:active {
            transform: scale(0.9);
        }

        .btn-play {
            background: #ffffff;
            color: #000;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 22px;
            padding-left: 3px;
        }

        #list { 
            text-align: left; 
            padding: 0; 
            list-style: none; 
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        /* Styling scrollbar daftar lagu */
        #list::-webkit-scrollbar {
            width: 6px;
        }
        #list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        li { 
            background: rgba(255, 255, 255, 0.08); 
            padding: 12px 16px; 
            margin: 8px 0; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        li.active { 
            background: #ff69b4; 
            color: #000; 
            font-weight: bold; 
            border-color: #ff69b4;
        }

        #yt-player-container {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="bg.jpg" alt="Poster" class="poster">
        
        <div class="marquee-container">
            <span class="marquee-text">Playlist By:@diazabimanyuu_</span>
        </div>

        <div class="player-card">
            <div class="song-info">
                <div class="song-title" id="title">Memuat...</div>
                <div class="song-artist" id="artist">@diazabimanyuu_</div>
            </div>

            <div class="progress-container">
                <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn-control" id="prev-btn">⏮</button>
                <button class="btn-control btn-play" id="play-btn">▶</button>
                <button class="btn-control" id="next-btn">⏭</button>
            </div>
        </div>

        <div id="yt-player-container">
            <div id="yt-player"></div>
        </div>

        <ul id="list"></ul>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const playlist = [
            { name: "Let Down", artist: "Radiohead", youtubeId: "ZVgHPSyEIqk" },
            { name: "No Surprises", artist: "Radiohead", youtubeId: "u5CVsCnxyXg" },
            { name: "Creep", artist: "Radiohead", youtubeId: "XFkzRNyygfk" },
            { name: "Exit Music (For A Film)", artist: "Radiohead", youtubeId: "Bf01riuiJWA" },
            { name: "Fake Plastic Trees", artist: "Radiohead", youtubeId: "n5h0qHwNrHk" },
            { name: "Karma Police", artist: "Radiohead", youtubeId: "1uYWYWPc9HU" },
            { name: "High and Dry", artist: "Radiohead", youtubeId: "GaTq1FODBjE" },
            { name: "Champagne Supernova", artist: "Oasis", youtubeId: "wFNbRmnO5Ag" },
            { name: "Slide Away", artist: "Oasis", youtubeId: "3GCSUSwcDwg" },
            { name: "Married With Children", artist: "Oasis", youtubeId: "EOoidN2s5qY" },
            { name: "Wonderwall", artist: "Oasis", youtubeId: "Cq1sOP5dbfc" },
            { name: "Don't Look Back In Anger", artist: "Oasis", youtubeId: "BiCAYO2iOnc" },
            { name: "Live Forever", artist: "Oasis", youtubeId: "nwXF6d-yLK8" }
        ];

        let player;
        let currentIndex = 0;
        let isPlaying = false;
        let updateInterval;

        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressEl = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const listContainer = document.getElementById('list');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: playlist[0].youtubeId,
                playerVars: {
                    'playsinline': 1,
                    'controls': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady() {
            renderList();
            loadTrack(0, false);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                nextTrack();
            } else if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playBtn.textContent = '❚❚';
                startProgressTimer();
            } else {
                isPlaying = false;
                playBtn.textContent = '▶';
                stopProgressTimer();
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function loadTrack(index, autoPlay = true) {
            currentIndex = index;
            const track = playlist[currentIndex];
            titleEl.textContent = track.name;
            artistEl.textContent = track.artist;
            updateActiveListItem();

            if (player && player.loadVideoById) {
                if (autoPlay) {
                    player.loadVideoById(track.youtubeId);
                } else {
                    player.cueVideoById(track.youtubeId);
                }
            }
        }

        function togglePlay() {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex, true);
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex, true);
        }

        function updateProgress() {
            if (player && player.getCurrentTime) {
                const current = player.getCurrentTime() || 0;
                const total = player.getDuration() || 0;
                if (total > 0) {
                    progressEl.value = (current / total) * 100;
                    currentTimeEl.textContent = formatTime(current);
                    durationEl.textContent = formatTime(total);
                }
            }
        }

        function startProgressTimer() {
            stopProgressTimer();
            updateInterval = setInterval(updateProgress, 500);
        }

        function stopProgressTimer() {
            clearInterval(updateInterval);
        }

        function updateActiveListItem() {
            const allItems = listContainer.querySelectorAll('li');
            allItems.forEach((el, i) => {
                if (i === currentIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        progressEl.addEventListener('input', () => {
            if (player && player.getDuration) {
                const total = player.getDuration();
                const seekTo = (progressEl.value / 100) * total;
                player.seekTo(seekTo, true);
            }
        });

        function renderList() {
            listContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('li');
                item.innerHTML = `<span>${index + 1}. ${track.name} - ${track.artist}</span>`;
                item.onclick = function() {
                    loadTrack(index, true);
                };
                listContainer.appendChild(item);
            });
        }
    </script>
</body>
    </html>
