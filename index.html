<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <!-- Library Howler.js untuk kestabilan audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
        body{background:#0a0b0d;min-height:100vh;color:#fff;display:flex;justify-content:center;align-items:center;padding:15px 10px;position:relative}
        #bg-video{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:1;filter:brightness(0.4);pointer-events:none}
        .container{width:100%;max-width:390px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:10}
        .header-title{font-size:13px;font-weight:600;letter-spacing:1.5px;color:rgba(255,255,255,0.8);margin-bottom:20px;text-transform:uppercase}
        .poster-container{width:100%;aspect-ratio:1/1;max-height:310px;border-radius:20px;overflow:hidden;box-shadow:0 15px 35px rgba(0,0,0,0.6);margin-bottom:20px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.15)}
        .poster{width:100%;height:100%;object-fit:cover}
        .player-card,.playlist-card,.bottom-nav{width:100%;background:rgba(0,0,0,0.45);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-radius:22px;padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.18);box-shadow:0 8px 32px rgba(0,0,0,0.5);text-align:center}
        .song-title{font-size:18px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .marquee-container{width:100%;overflow:hidden;white-space:nowrap}
        .song-artist{font-size:13px;color:rgba(255,255,255,0.85);display:inline-block;padding-left:100%;animation:marquee 10s linear infinite}
        @keyframes marquee{0%{transform:translate(0,0)}100%{transform:translate(-100%,0)}}
        .progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.25);border-radius:2px;outline:none;-webkit-appearance:none;margin-top:12px}
        .progress-bar::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
        .time-stamps{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.6);margin-top:6px}
        .controls{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 0}
        .btn-icon{background:none;border:none;color:rgba(255,255,255,0.8);font-size:16px;cursor:pointer}
        .btn-main{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
        .btn-play{background:rgba(255,255,255,0.95);color:#000;width:48px;height:48px;border-radius:50%;font-size:18px;display:flex;justify-content:center;align-items:center}
        .playlist-card{padding:16px 18px}
        .playlist-header{font-size:13px;font-weight:600;color:rgba(255,255,255,0.7);margin-bottom:12px;text-align:left}
        #list{text-align:left;list-style:none;max-height:240px;overflow-y:auto}
        li{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer;font-size:13px;color:rgba(255,255,255,0.85)}
        li.active{color:#fff;font-weight:700}
        .song-name-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;display:block}
        .bottom-nav{margin-top:0;padding:10px 0;display:flex;justify-content:space-around;border-radius:16px}
        .nav-item{color:rgba(255,255,255,0.5);font-size:18px}
        .nav-item.active{color:#fff}
        .status-badge{font-size:10px;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,0.2);margin-bottom:8px;display:inline-block}
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="https://files.catbox.moe/ypad4h.mp4" type="video/mp4">
    </video>

    <div class="container">
        <div class="header-title">NOW PLAYING</div>
        <div class="poster-container">
            <img src="sampul.jpg" alt="Poster" class="poster">
        </div>

        <div class="player-card">
            <div id="status" class="status-badge">Siap Diputar</div>
            <div class="song-title" id="title">Memuat...</div>
            <div class="marquee-container">
                <div class="song-artist" id="artist">Inst:diazabimanyuu_</div>
            </div>

            <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
            <div class="time-stamps">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button class="btn-icon" id="shuffle-btn">🔀</button>
                <button class="btn-main" id="prev-btn">⏮</button>
                <button class="btn-main btn-play" id="play-btn">▶</button>
                <button class="btn-main" id="next-btn">⏭</button>
                <button class="btn-icon" id="like-btn">♡</button>
            </div>
        </div>

        <div class="playlist-card">
            <div class="playlist-header" id="playlist-count">PLAYLIST • 41 LAGU</div>
            <ul id="list"></ul>
        </div>

        <div class="bottom-nav">
            <span class="nav-item active">🏠</span>
            <span class="nav-item">🔍</span>
            <span class="nav-item">📚</span>
        </div>
    </div>

    <script>
        const bgVideo = document.getElementById('bg-video');
        if (bgVideo) bgVideo.muted = true;

        const playlist = [
            { name: "Sandiwara semu", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/6ewg4x.mp3" },
            { name: "Jefferson", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/9vcdbd.mp3" },
            { name: "Everything you are", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/q14tmt.mp3" },
            { name: "Full album Bernadya", artist: "Bernadya", url: "https://files.catbox.moe/d3owq2.mp3" },
            { name: "Full album Perunggu", artist: "Perunggu", url: "https://files.catbox.moe/71u2au.mp3" },
            { name: "Sekian, Terima Kasih", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/qv16ar.mp3" },
            { name: "Bersandarlah", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/nmmb6s.mp3" },
            { name: "FSTVLST full album", artist: "FSTVLST", url: "https://files.catbox.moe/e21vyk.mp3" },
            { name: "Full album Paradoks Diametral", artist: "Paradoks Diametral", url: "https://files.catbox.moe/do8aaz.mp3" },
            { name: "Full album Hindia", artist: "Hindia", url: "https://files.catbox.moe/rz5l15.mp3" },
            { name: "Panasea", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/kynaza.mp3" },
            { name: "Kuning", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/myjyb8.mp3" },
            { name: "Anomali", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/0zrnxd.mp3" },
            { name: "ATAS NAMA", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/7s5q5z.mp3" },
            { name: "Track 8", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/9kq1w9.mp3" },
            { name: "Champagne Supernova", artist: "Oasis", url: "https://files.catbox.moe/e41vv4.mp3" },
            { name: "Don't Look Back In Anger", artist: "Oasis", url: "https://files.catbox.moe/uxynqm.mp3" },
            { name: "Slide Away", artist: "Oasis", url: "https://files.catbox.moe/tslath.mp3" },
            { name: "Wonderwall", artist: "Oasis", url: "https://files.catbox.moe/64ylcp.mp3" },
            { name: "Tinky Winky full album", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/zskwa1.mp3" },
            { name: "Ceritaku Ceritamu", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/b270xq.mp3" },
            { name: "Kita Kubur Sampai Mati", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/o5azqh.mp3" },
            { name: "Ruang Sendiri", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/xrz84p.mp3" },
            { name: "Who Knows", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/tvltgy.mp3" },
            { name: "10 Menit Untuk Selamanya", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/r4epfg.mp3" },
            { name: "Let Down", artist: "Radiohead", url: "https://files.catbox.moe/cpy5fk.mp3" },
            { name: "No Surprises", artist: "Radiohead", url: "https://files.catbox.moe/1egzv1.mp3" },
            { name: "Fake Plastic Trees", artist: "Radiohead", url: "https://files.catbox.moe/tww0an.mp3" },
            { name: "Creep", artist: "Radiohead", url: "https://files.catbox.moe/am615v.mp3" },
            { name: "Exit Music", artist: "Radiohead", url: "https://files.catbox.moe/vq2k0n.mp3" },
            { name: "Stand By Me", artist: "Oasis", url: "https://files.catbox.moe/9tam7j.mp3" },
            { name: "Married With Children", artist: "Oasis", url: "https://files.catbox.moe/fif5lo.mp3" },
            { name: "Don't Go Away", artist: "Oasis", url: "https://files.catbox.moe/fcfzmu.mp3" },
            { name: "Supersonic", artist: "Oasis", url: "https://files.catbox.moe/qzrzft.mp3" },
            { name: "Sambutlah", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/pgijz3.mp3" },
            { name: "Bertaruh Pada Api", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/rllra6.mp3" },
            { name: "Metafora Berpelukan", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/v3ebyu.mp3" },
            { name: "Lautan Bunga Berwarna Terang", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/1x27ee.mp3" },
            { name: "Disarankan Di Bandung", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/djolg6.mp3" },
            { name: "Lagu Selepas Hujan", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/p1495a.mp3" },
            { name: "Pop Kinetik", artist: "Inst:diazabimanyuu_", url: "https://files.catbox.moe/0v0mn4.mp3" }
        ];

        let currentIndex = 0;
        let sound = null;
        let timer = null;

        const playBtn = document.getElementById('play-btn');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressEl = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const listContainer = document.getElementById('list');
        const statusEl = document.getElementById('status');

        function formatTime(sec) {
            if (isNaN(sec) || sec === 0) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function loadTrack(index, autoplay = false) {
            currentIndex = index;
            const track = playlist[currentIndex];

            if (sound) {
                sound.unload();
            }

            titleEl.textContent = track.name;
            artistEl.textContent = track.artist;
            progressEl.value = 0;
            currentTimeEl.textContent = "0:00";
            durationEl.textContent = "0:00";
            statusEl.textContent = "Memuat Audio...";
            statusEl.style.background = "rgba(255,200,0,0.3)";
            updateActiveListItem();

            sound = new Howl({
                src: [track.url],
                html5: true, // Diputar secara streaming langsung tanpa memblokir UI
                format: ['mp3'],
                onload: function() {
                    durationEl.textContent = formatTime(sound.duration());
                },
                onplay: function() {
                    playBtn.textContent = '❚❚';
                    statusEl.textContent = "Memutar ♪";
                    statusEl.style.background = "rgba(0,255,100,0.3)";
                    requestAnimationFrame(step);
                },
                onpause: function() {
                    playBtn.textContent = '▶';
                    statusEl.textContent = "Jeda";
                    statusEl.style.background = "rgba(255,255,255,0.2)";
                },
                onend: function() {
                    loadTrack((currentIndex + 1) % playlist.length, true);
                },
                onloaderror: function() {
                    statusEl.textContent = "Gagal Memuat";
                    statusEl.style.background = "rgba(255,0,0,0.4)";
                }
            });

            if (autoplay) {
                sound.play();
            }
        }

        function step() {
            if (sound && sound.playing()) {
                const seek = sound.seek() || 0;
                currentTimeEl.textContent = formatTime(seek);
                progressEl.value = ((seek / sound.duration()) * 100) || 0;
                requestAnimationFrame(step);
            }
        }

        function togglePlay() {
            if (!sound) {
                loadTrack(currentIndex, true);
                return;
            }
            if (sound.playing()) {
                sound.pause();
            } else {
                sound.play();
            }
        }

        function updateActiveListItem() {
            const items = listContainer.querySelectorAll('li');
            items.forEach((el, i) => {
                if (i === currentIndex) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        document.getElementById('play-btn').onclick = togglePlay;
        document.getElementById('prev-btn').onclick = () => loadTrack((currentIndex - 1 + playlist.length) % playlist.length, true);
        document.getElementById('next-btn').onclick = () => loadTrack((currentIndex + 1) % playlist.length, true);

        progressEl.oninput = () => {
            if (sound && sound.duration()) {
                const per = progressEl.value / 100;
                sound.seek(sound.duration() * per);
            }
        };

        function renderList() {
            listContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('li');
                item.innerHTML = `<span class="song-name-item">${index + 1}. ${track.name}</span>`;
                item.onclick = () => loadTrack(index, true);
                listContainer.appendChild(item);
            });
        }

        renderList();
        loadTrack(0, false);
    </script>
</body>
    </html>
